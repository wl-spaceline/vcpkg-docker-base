name: Cleanup cache when PR is merged

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cleanup caches for closed PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh extension install actions/gh-actions-cache

          REPO=${{ github.repository }}
          # The branch/ref of the PR that was just closed
          BRANCH="refs/pull/${{ github.event.pull_request.number }}/merge"

          echo "Searching for caches belonging to $BRANCH..."
          
          # List and delete all caches associated with this specific PR
          caches=$(gh actions-cache list -R $REPO -B $BRANCH --limit 100 | cut -f 1)

          for cacheKey in $caches; do
            echo "Deleting $cacheKey"
            gh actions-cache delete $cacheKey -R $REPO --confirm
          done
          echo "Done!"